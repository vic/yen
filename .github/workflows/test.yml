# DO-NOT-EDIT. Generated by docs/modules/ci.nix (the docs fleet). Regenerate: cd docs && nix run .#write-files
# Jobs: docs-build, docs-check, docs-e2e, docs-test, engine-cost, engine-test, eval-aarch64-darwin, eval-aarch64-linux, eval-x86_64-linux, flake-check, fmt, lean-check, reference-cost, reference-e2e, reference-mcp, reference-test
"concurrency":
  "cancel-in-progress": "${{ github.ref != 'refs/heads/main' && github.event.action == 'synchronize' }}"
  "group": "${{ github.workflow }}-${{ github.ref }}"
"jobs":
  "docs-build":
    "needs":
      - "fmt"
      - "docs-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "site build"
        "run": "nix develop ./docs -c docs-build"
    "timeout-minutes": 30
  "docs-check":
    "needs":
      - "fmt"
      - "docs-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "docs flake check: pages and workflows current"
        "run": "nix develop ./docs -c docs-check"
    "timeout-minutes": 30
  "docs-e2e":
    "needs":
      - "fmt"
      - "docs-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "docs examples: real evaluations (e2e)"
        "run": "nix develop ./docs -c docs-e2e"
    "timeout-minutes": 60
  "docs-test":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "docs examples"
        "run": "nix develop ./docs -c docs-test"
    "timeout-minutes": 30
  "engine-cost":
    "needs":
      - "fmt"
      - "engine-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "cost oracles (memos)"
        "run": "nix develop ./docs -c engine-cost"
    "timeout-minutes": 20
  "engine-test":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "engine and library oracles"
        "run": "nix develop ./docs -c engine-test"
    "timeout-minutes": 20
  "eval-aarch64-darwin":
    "needs":
      - "fmt"
      - "reference-test"
    "runs-on": "macos-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every aarch64-darwin target of ci.json evaluates"
        "run": "nix develop ./docs -c reference-eval aarch64-darwin"
    "timeout-minutes": 30
  "eval-aarch64-linux":
    "needs":
      - "fmt"
      - "reference-test"
    "runs-on": "ubuntu-24.04-arm"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every aarch64-linux target of ci.json evaluates"
        "run": "nix develop ./docs -c reference-eval aarch64-linux"
    "timeout-minutes": 30
  "eval-x86_64-linux":
    "needs":
      - "fmt"
      - "reference-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every x86_64-linux target of ci.json evaluates"
        "run": "nix develop ./docs -c reference-eval x86_64-linux"
    "timeout-minutes": 30
  "flake-check":
    "needs":
      - "fmt"
      - "reference-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "nix flake check of the fleet"
        "run": "nix develop ./docs -c reference-check"
    "timeout-minutes": 120
  "fmt":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every nix file is formatted (nixfmt)"
        "run": "nix develop ./docs -c fmt-check"
      -
        "name": "the workflows are valid (actionlint)"
        "run": "nix develop ./docs -c lint"
    "timeout-minutes": 30
  "lean-check":
    "needs":
      - "fmt"
      - "engine-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "Lean proofs of the certificate checker"
        "run": "nix develop ./docs -c lean-check"
    "timeout-minutes": 20
  "reference-cost":
    "needs":
      - "fmt"
      - "reference-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "trimmed module lists cost oracle"
        "run": "nix develop ./docs -c reference-cost"
    "timeout-minutes": 30
  "reference-e2e":
    "needs":
      - "fmt"
      - "reference-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "real evaluations (e2e)"
        "run": "nix develop ./docs -c reference-e2e"
      -
        "if": "failure()"
        "name": "memory at failure (diagnostic)"
        "run": "free -m; sudo dmesg | tail -40"
    "timeout-minutes": 120
  "reference-mcp":
    "needs":
      - "fmt"
      - "reference-test"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "MCP server and flake app"
        "run": "nix develop ./docs -c reference-mcp"
    "timeout-minutes": 30
  "reference-test":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "fleet checks"
        "run": "nix develop ./docs -c reference-test"
    "timeout-minutes": 30
"name": "test"
"on":
  "pull_request": {}
  "push":
    "branches":
      - "main"
  "workflow_dispatch": {}
"permissions":
  "contents": "read"
